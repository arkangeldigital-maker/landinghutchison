# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lista de fotos (img/fotos.json)
        # El sitio lee esta lista en lugar de preguntar foto por foto si existe.
        # Se genera en cada publicación, así siempre refleja las fotos reales.
        run: |
          python3 - <<'PY'
          import json, os
          lista = {}
          for c in sorted(os.listdir('img')):
              fotos, n = [], 1
              while n <= 30 and os.path.isfile(f'img/{c}/{n}.jpg'):
                  fotos.append(f'img/{c}/{n}.jpg'); n += 1
              if fotos: lista[f'img/{c}'] = fotos
          with open('img/fotos.json', 'w') as f: json.dump(lista, f)
          print(json.dumps(lista, indent=1))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
