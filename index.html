<!doctype html>
<html lang="es" data-xml="contenido.xml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hutchison Ports México</title>
  <meta name="description" content="Directorio de terminales y servicios de Hutchison Ports en México: contenedores, intermodal, cruceros, multipropósito, astillero y logística.">
  <meta name="theme-color" content="#0b2a5c">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icono-180.png">

  <!-- ═══════════════ VISTA PREVIA AL COMPARTIR (WhatsApp, LinkedIn, Facebook, X) ═══════════════
       Estas redes NO leen contenido.xml: toman el título, la descripción y la imagen de aquí.
       ⚠ Reemplaza https://www.TU-DOMINIO.com por la dirección real del sitio (aparece 3 veces).
       Imagen: img/compartir.jpg (1200×630 px). Si la cambias, usa ese mismo tamaño. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hutchison Ports México">
  <meta property="og:locale" content="es_MX">
  <meta property="og:title" content="Hutchison Ports en México">
  <meta property="og:description" content="Directorio de terminales y servicios: contenedores, intermodal, cruceros, multipropósito, astillero y logística en Ensenada, Manzanillo, Lázaro Cárdenas, Hidalgo y Veracruz.">
  <meta property="og:url" content="https://www.TU-DOMINIO.com/">
  <meta property="og:image" content="https://www.TU-DOMINIO.com/img/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Hutchison Ports en México: directorio de terminales y servicios">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hutchison Ports en México">
  <meta name="twitter:description" content="Directorio de terminales y servicios de Hutchison Ports en México.">
  <meta name="twitter:image" content="https://www.TU-DOMINIO.com/img/compartir.jpg">
  <!-- ═══════════════ FIN VISTA PREVIA AL COMPARTIR ═══════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <!-- La primera foto de la portada empieza a bajar desde ya, sin esperar a que se arme la página. -->
  <link rel="preload" as="image" href="img/portada/1.jpg" fetchpriority="high">
  <!-- Modo nocturno: se aplica antes de pintar para que no parpadee.
       Usa lo que la persona eligió con el botón (luna/sol); si nunca eligió, sigue al sistema. -->
  <script>
    (function () {
      var t; try { t = localStorage.getItem('tema'); } catch (e) {}
      if (t !== 'oscuro' && t !== 'claro') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t);
    })();
  </script>
  <!-- El contenido y la lista de fotos empiezan a bajar desde ya, sin esperar a js/sitio.js. -->
  <script>
    (function () {
      var fuente = document.documentElement.getAttribute('data-xml') || 'contenido.xml', v = 'v=' + Date.now();
      function pedir(u) { return fetch(u, { cache: 'no-store' }).catch(function () { return null; }); }
      try {
        window.PRECARGA = {
          xml: pedir(fuente + (fuente.indexOf('?') === -1 ? '?' : '&') + v),
          fotos: pedir(new URL('img/fotos.json', new URL(fuente, location.href)).href + '?' + v),
          docs: pedir(new URL('docs/lista.json', new URL(fuente, location.href)).href + '?' + v)
        };
      } catch (e) {}
    })();
  </script>

  <!-- ═══════════════ MEDICIÓN DE VISITAS (Google Analytics 4) ═══════════════
       ID PROVISIONAL: cuando cambie el dominio final, reemplaza G-HYLGEQNFGL
       en la línea "var GA_ID" de abajo (es el único lugar donde aparece).
       Con Analytics activo, el sitio registra además qué Brochure/Expansión se abren
       (evento "abrir_documento") y qué ciudades se eligen en el mapa ("elegir_ciudad"). -->
  <script>
    var GA_ID = 'G-HYLGEQNFGL';
    (function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
      document.head.appendChild(s);
    })();
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', GA_ID);
  </script>
  <!-- ═══════════════ FIN MEDICIÓN DE VISITAS ═══════════════ -->
</head>
<body class="cargando">

  <!-- Toda la página se arma desde contenido.xml (js/sitio.js).
       Estos contenedores solo marcan dónde va cada parte. -->
  <header class="cabecera" id="cabecera"></header>
  <main id="contenido">
    <div class="pantalla-carga" aria-live="polite">
      <span class="pantalla-carga-marca"></span>
    </div>
  </main>
  <footer class="pie" id="pie"></footer>

  <div class="aviso" id="aviso" role="status" hidden></div>

  <script src="js/sitio.js"></script>
</body>
</html>
